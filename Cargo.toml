[package]
name = "s4suite"
version = "2.0.0"
edition = "2021"
authors = ["S4Suite Team"]
description = "The Sims 4 Mod & Content Manager for Linux (Rust + Slint)"

[dependencies]
slint = "1.8"
parking_lot = "0.12"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
md-5 = "0.10"
sha2 = "0.10"
dunce = "1.0"
tempfile = "3.10"
walkdir = "2.5"
zip = "2.1"
sevenz-rust = "0.6"
regex = "1.10"
encoding_rs = "0.8"
dirs = "5.0"
rust-embed = "8.4"
byteorder = "1.5"
rfd = "0.14"
glob = "0.3"
tracing-subscriber = "0.3"
indexmap = "2.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
[profile.release]
# O binário sai com ~49 MB sem isto, quase tudo símbolos de depuração que o
# usuário final não usa. `panic = "abort"` fica de fora de propósito: as tarefas
# em `spawn_blocking` isolam falhas por arquivo, e sem unwind um package
# corrompido derrubaria o app inteiro em vez de virar uma linha de erro.
lto = true
codegen-units = 1
strip = true

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
i-slint-backend-testing = "1.8"
tempfile = "3.10"
zip = "2.1"
